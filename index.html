<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mātauranga Nova — Your HIV Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1c17;
      --surface: rgba(26, 43, 36, 0.95);
      --accent: #4a7043;
      --accent-light: #6b9e7e;
      --text: #e8f5e9;
      --muted: #a8c4b0;
      --radius: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(74, 112, 67, 0.12) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(212, 168, 60, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .widget {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      background: var(--surface);
      border-radius: 0;
      box-shadow: 0 0 80px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(107, 158, 126, 0.15);
    }

    @media (min-width: 600px) {
      .widget { height: 92dvh; border-radius: var(--radius); }
    }

    .header {
      padding: 20px 24px;
      background: rgba(15, 28, 23, 0.7);
      border-bottom: 1px solid rgba(107, 158, 126, 0.2);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .avatar {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 25px rgba(74, 112, 67, 0.5);
    }

    .header-info h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 600;
    }

    .header-status {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 10px #4ade80; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .msg {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 20px;
      line-height: 1.6;
      font-size: 15.5px;
      animation: fadeIn 0.4s ease;
    }

    .msg.user {
      align-self: flex-end;
      background: rgba(74, 112, 43, 0.9);
      border-bottom-right-radius: 6px;
    }

    .msg.nova {
      align-self: flex-start;
      background: rgba(26, 43, 36, 0.98);
      border: 1px solid rgba(107, 158, 126, 0.3);
      border-bottom-left-radius: 6px;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .input-area {
      padding: 20px 24px;
      background: rgba(15, 28, 23, 0.85);
      border-top: 1px solid rgba(107, 158, 126, 0.2);
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: rgba(26, 43, 36, 0.95);
      border: 1px solid rgba(107, 158, 126, 0.35);
      border-radius: 18px;
      padding: 14px 18px;
      color: var(--text);
      font-size: 15.5px;
      resize: none;
      max-height: 120px;
      outline: none;
    }

    button {
      width: 52px;
      height: 52px;
      background: var(--accent);
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover { background: var(--accent-light); transform: scale(1.08); }

    .typing {
      color: var(--muted);
      font-style: italic;
      padding: 8px 0;
      align-self: flex-start;
    }

    .disclaimer {
      font-size: 11.5px;
      color: var(--muted);
      text-align: center;
      padding: 14px 24px;
      background: rgba(0,0,0,0.4);
      border-top: 1px solid rgba(107, 158, 126, 0.15);
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="widget">
    <div class="header">
      <div class="avatar">🌿</div>
      <div class="header-info">
        <h1>Mātauranga Nova</h1>
        <div class="header-status">
          <span class="status-dot"></span> Always available • 100% private
        </div>
      </div>
    </div>

    <div class="messages" id="chat-box">
      <div class="typing" id="typing">Nova is typing...</div>
    </div>

    <div class="input-area">
      <textarea id="userInput" rows="1" placeholder="Type your message..." 
                oninput="autoHeight(this)" onkeydown="checkEnter(event)"></textarea>
      <button onclick="sendMessage()">↑</button>
    </div>

    <div class="disclaimer">
      NOVA is an AI created especially for the Burnett Foundation Innovation Challenge 2026. 
      This is not a substitute for professional medical advice. Conversations are private.
    </div>
  </div>

  <script>
    const API_URL = "https://matauranga-nova8.onrender.com/chat";   // ← Cambia si tu URL es diferente
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('userInput');
    const typing = document.getElementById('typing');
    let sessionId = "nova-" + Date.now();

    function autoHeight(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 110) + 'px';
    }

    function checkEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function appendMsg(text, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setLoading(state) {
      typing.style.display = state ? 'block' : 'none';
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMsg(text, 'user');
      userInput.value = '';
      userInput.style.height = 'auto';

      setLoading(true);

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text, sessionId: sessionId })
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const data = await response.json();

        if (data.reply) {
          const cleanText = data.reply.replace(/\[TAG:.*?\]/g, '').trim();
          appendMsg(cleanText, 'nova');
        } else {
          appendMsg("Sorry, I didn't receive a clear response. Please try again.", 'nova');
        }
      } catch (err) {
        console.error(err);
        appendMsg("Connection error. Please check your internet and try again.", 'nova');
      } finally {
        setLoading(false);
        userInput.focus();
      }
    }

    // Mensaje inicial en inglés
    window.onload = () => {
      const initialMsg = "Kia ora — I'm Nova. I'm here to support you with HIV-related topics with honesty, warmth, and no judgement. This chat is completely private and nothing is stored permanently. I'm an AI, not a healthcare professional. What's on your mind today?";
      appendMsg(initialMsg, 'nova');
    };
  </script>
</body>
</html>
