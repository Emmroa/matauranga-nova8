<script>
  const API_URL = "https://matauranga-nova8.onrender.com/chat";
  const chatBox = document.getElementById('chat-box');
  const userInput = document.getElementById('userInput');
  const typing = document.getElementById('typing');
  const sendBtn = document.getElementById('sendBtn');
  const welcome = document.getElementById('welcome');

  let sessionId = "session-" + Date.now();

  // Función segura para agregar mensaje
  function appendMsg(text, sender) {
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.innerText = text;
    chatBox.insertBefore(div, typing || null);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function setLoading(state) {
    if (typing) typing.style.display = state ? 'block' : 'none';
    if (sendBtn) sendBtn.disabled = state;
    if (userInput) userInput.disabled = state;
  }

  async function sendMessage() {
    const text = userInput ? userInput.value.trim() : '';
    if (!text) return;

    if (welcome) welcome.style.display = 'none';

    appendMsg(text, 'user');
    if (userInput) {
      userInput.value = '';
      userInput.style.height = 'auto';
    }

    setLoading(true);

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: text, sessionId: sessionId })
      });

      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const data = await response.json();

      const cleanText = (data.reply || data.fullReply || "Sin respuesta").replace(/\[TAG:.*?\]/g, '').trim();
      appendMsg(cleanText || "Nova no respondió correctamente.", 'nova');

    } catch (err) {
      console.error("Error:", err);
      appendMsg("Error de conexión con NOVA. El servidor está activo pero hubo un problema.", 'nova');
    } finally {
      setLoading(false);
      if (userInput) userInput.focus();
    }
  }

  function checkEnter(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function quickMsg(text) {
    if (userInput) userInput.value = text;
    sendMessage();
  }

  function autoHeight(el) {
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  // Mostrar mensaje inicial seguro
  function initChat() {
    appendMsg("Kia ora — soy NOVA. Vivo con VIH desde 2011 y estoy acá para acompañarte. Esta charla es privada. ¿Qué te anda pasando hoy?", 'nova');
  }

  // Inicialización con protección contra errores
  window.onload = function() {
    try {
      initChat();
      if (userInput) userInput.focus();

      // Health check en consola
      fetch(API_URL.replace('/chat', '/health'))
        .then(r => r.json())
        .then(data => console.log("✅ Backend OK", data))
        .catch(() => console.warn("⚠️ Health check falló"));
    } catch (e) {
      console.error("Error crítico al iniciar:", e);
      const errorDiv = document.createElement('div');
      errorDiv.style.color = 'red';
      errorDiv.style.padding = '20px';
      errorDiv.innerHTML = `<strong>Error al cargar NOVA:</strong><br>${e.message}<br><br>Revisa la consola (F12) y avísale a Emanuel.`;
      document.body.appendChild(errorDiv);
    }
  };
</script>
