<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA</title>
  <style>
    body { font-family: sans-serif; background: #0e1a12; color: #e8f0e4; padding: 20px; margin: 0; }
    .msg { margin: 15px 0; padding: 12px; border-radius: 12px; }
    .nova { background: #1a2b20; }
    .user { background: #264a2e; text-align: right; }
    textarea { width: 100%; padding: 12px; background: #132019; color: white; border: 1px solid #86c470; border-radius: 8px; }
    button { padding: 12px 20px; background: #86c470; border: none; border-radius: 8px; color: black; }
  </style>
</head>
<body>

  <h2>🌿 Mātauranga Nova</h2>
  <div id="chat" style="height: 60vh; overflow-y: auto; margin-bottom: 15px;"></div>

  <textarea id="input" rows="2" placeholder="Escribí aquí..."></textarea><br><br>
  <button onclick="sendMessage()">Enviar</button>

  <script>
    const API_URL = "https://matauranga-nova8.onrender.com/chat";
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    let sessionId = "session-" + Date.now();

    function append(text, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      append(text, 'user');
      input.value = '';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({prompt: text, sessionId: sessionId})
        });

        const data = await res.json();
        const reply = (data.reply || "Sin respuesta").replace(/\[TAG:.*?\]/g, '');
        append(reply, 'nova');
      } catch (e) {
        append("Error de conexión: " + e.message, 'nova');
      }
    }

    // Mensaje inicial
    window.onload = () => {
      append("Kia ora — soy NOVA. ¿Qué te anda pasando hoy?", 'nova');
    };
  </script>

  <!-- Eruda para ver errores en celular -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

</body>
</html>
