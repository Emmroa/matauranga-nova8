       <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mātauranga NOVA</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="preconnect">
  <style>
    :root {
      --accent: #0ea5e9;
      --bg-primary: #080e18;
      --bg-secondary: rgba(13, 21, 37, 0.85);
      --glass-bg: rgba(13, 21, 37, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.2);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.8);
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      overflow: hidden;
      height: 100vh;
      line-height: 1.6;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #app {
      position: relative;
      z-index: 10;
      width: min(90%, 1200px);
      height: clamp(85vh, 90vh, 95vh);
      margin: clamp(2rem, 5vh, 4rem) auto;
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    #title {
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: all 0.3s ease;
    }

    .exit-btn {
      color: #ef4444;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .exit-btn:hover {
      background: rgba(239, 68, 68, 0.1);
      transform: translateY(-1px);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) transparent;
    }

    #chat::-webkit-scrollbar {
      width: 6px;
    }

    #chat::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 3px;
    }

    .message {
      padding: 1rem 1.5rem;
      border-radius: 20px;
      max-width: 85%;
      font-size: 0.95rem;
      line-height: 1.6;
      animation: fadeInUp 0.3s ease-out;
      word-wrap: break-word;
      hyphens: auto;
    }

    .message.bot {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), #0284c7);
      color: white;
      font-weight: 500;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .input-container {
      padding: 1.5rem 2rem;
      background: rgba(0, 0, 0, 0.3);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 1rem;
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      padding: 0.875rem 1.25rem;
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    #input::placeholder {
      color: var(--text-secondary);
    }

    #input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
      background: rgba(255, 255, 255, 0.08);
    }

    #send-btn {
      background: linear-gradient(135deg, var(--accent), #0284c7);
      border: none;
      padding: 0.875rem 1.75rem;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      font-family: inherit;
      transition: all 0.2s ease;
      min-width: 80px;
    }

    #send-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(14, 165, 233, 0.3);
    }

    #send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #send-btn.sending {
      background: linear-gradient(135deg, #64748b, #475569);
    }

    @media (max-width: 768px) {
      #app {
        margin: 1rem;
        height: 95vh;
        border-radius: 16px;
      }
      
      header, .input-container {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
      
      #chat {
        padding: 1.5rem;
      }
      
      .message {
        max-width: 95%;
      }
    }

    /* Mejoras para accesibilidad */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas" aria-hidden="true"></canvas>
  
  <main id="app" role="main">
    <header role="banner">
      <h1 id="title" aria-label="Mātauranga NOVA">MĀTAURANGA NOVA</h1>
      <button class="exit-btn" onclick="app.reset()" aria-label="Salir y recargar página" title="Salida rápida">
        ✕ SALIDA RÁPIDA
      </button>
    </header>
    
    <section id="chat" role="log" aria-live="polite">
      <!-- Mensajes se agregan dinámicamente -->
    </section>
    
    <footer class="input-container" role="form">
      <input 
        type="text" 
        id="input" 
        placeholder="Escribe aquí de forma segura..." 
        autocomplete="off"
        aria-label="Mensaje a enviar"
      >
      <button id="send-btn" onclick="app.sendMessage()" aria-label="Enviar mensaje">
        ENVIAR
      </button>
    </footer>
  </main>

  <script>
    class MataurangaApp {
      constructor() {
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.chat = document.getElementById('chat');
        this.input = document.getElementById('input');
        this.sendBtn = document.getElementById('send-btn');
        this.title = document.getElementById('title');
        
        this.COLORS = {
          neutral: [14, 165, 233],
          warm: [16, 185, 129],
          alert: [239, 68, 68]
        };
        
        this.currentRGB = [...this.COLORS.neutral];
        this.targetRGB = [...this.COLORS.neutral];
        this.animationId = null;
        this.isSending = false;
        
        this.init();
      }

      init() {
        this.setupCanvas();
        this.setupEventListeners();
        this.startAnimation();
        this.chat.scrollTop = this.chat.scrollHeight;
      }

      setupCanvas() {
        const resizeCanvas = () => {
          this.canvas.width = window.innerWidth;
          this.canvas.height = window.innerHeight;
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas, { passive: true });
      }

      setupEventListeners() {
        this.input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            this.sendMessage();
          }
        });

        // Soporte para arrastrar archivos
        this.input.addEventListener('paste', this.handlePaste.bind(this));
      }

      startAnimation() {
        const animate = () => {
          this.updateBackground();
          this.renderNeuralNetwork();
          this.animationId = requestAnimationFrame(animate);
        };
        animate();
      }

      updateBackground() {
        const lerp = (a, b, t) => a + (b - a) * t;
        
        for (let i = 0; i < 3; i++) {
          this.currentRGB[i] = lerp(this.currentRGB[i], this.targetRGB[i], 0.025);
        }
        
        const color = `rgb(${Math.round(this.currentRGB[0])},${Math.round(this.currentRGB[1])},${Math.round(this.currentRGB[2])})`;
        document.documentElement.style.setProperty('--accent', color);
        this.title.style.background = `linear-gradient(135deg, ${color}, ${this.adjustColor(this.currentRGB, 30)})`;
      }

      renderNeuralNetwork() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        const accentColor = `rgb(${this.currentRGB[0]},${this.currentRGB[1]},${this.currentRGB[2]})`;
        this.ctx.fillStyle = accentColor;
        this.ctx.globalAlpha = 0.4;
        this.ctx.shadowBlur = 20;
        this.ctx.shadowColor = accentColor;

        // Nodos de la red neuronal optimizados
        const nodeCount = 60;
        for (let i = 0; i < nodeCount; i++) {
          const x = (i / nodeCount) * this.canvas.width;
          const y = Math.sin(Date.now() * 0.001 + i * 0.1) * 50 + this.canvas.height / 2;
          const size = 2 + Math.sin(Date.now() * 0.002 + i) * 1;
          
          this.ctx.beginPath();
          this.ctx.arc(x, y, size, 0, Math.PI * 2);
          this.ctx.fill();
        }
        
        this.ctx.shadowBlur = 0;
        this.ctx.globalAlpha = 1;
      }

      adjustColor(rgb, amount) {
        return `rgb(${rgb.map(c => Math.min(255, Math.max(0, c + amount))).join(',')})`;
      }

      async sendMessage() {
        if (this.isSending || !this.input.value.trim()) return;
        
        const message = this.input.value.trim();
        this.input.value = '';
        this.addMessage(message, 'user');
        
        this.isSending = true;
        this.sendBtn.disabled = true;
        this.sendBtn.classList.add('sending');
        this.sendBtn.textContent = 'ENVIANDO…';

        try {
          const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
          });

          if (!response.ok) throw new Error('Error en la respuesta del servidor');

          await this.streamResponse(response);
        } catch (error) {
          console.error('Error:', error);
          this.addMessage('Lo siento, ocurrió un error. Intenta de nuevo.', 'bot');
        } finally {
          this.isSending = false;
          this.sendBtn.disabled = false;
          this.sendBtn.classList.remove('sending');
          this.sendBtn.textContent = 'ENVIAR';
        }
      }

      async streamResponse(response) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        const botDiv = this.addMessage('', 'bot');

        try {
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            const lines = chunk.split('\n');
            
            for (const line of lines) {
              if (line.startsWith('data: ')) {
                try {
                  const data = JSON.parse(line.slice(6));
                  if (data.type === 'metadata') {
                    this.targetRGB = this.COLORS[data.sentiment] || this.COLORS.neutral;
                  } else if (data.type === 'delta' && data.text) {
                    botDiv.innerHTML = marked.parse(data.text);
                  }
                } catch (e) {
                  console.warn('Error parsing SSE data:', e);
                }
              }
            }
          }
        } finally {
          reader.releaseLock();
        }
      }

      addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerHTML = marked.parse(text);
        div.setAttribute('role', sender === 'user' ? 'user' : 'assistant');
        this.chat.appendChild(div);
        this.scrollToBottom();
        return div;
      }

      scrollToBottom() {
        this.chat.scrollTo({
          top: this.chat.scrollHeight,
          behavior: 'smooth'
        });
      }

      reset() {
        if (confirm('¿Estás seguro de que quieres salir? Se recargará la página.')) {
          window.location.reload();
        }
      }

      handlePaste(e) {
        // Manejo futuro para archivos pegados
        const items = Array.from(e.clipboardData.items);
        const imageItem = items.find(item => item.type.startsWith('image/'));
        if (imageItem) {
          e.preventDefault();
          // Implementar procesamiento de imágenes
        }
      }

      destroy() {
        if (this.animationId) {
          cancelAnimationFrame(this.animationId);
        }
      }
    }

    // Inicialización cuando el DOM esté listo
    let app;
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        app = new MataurangaApp();
        window.app = app; // Exponer globalmente para botones
      });
    } else {
      app = new MataurangaApp();
      window.app = app;
    }

    // Cleanup en unload
    window.addEventListener('beforeunload', () => {
      if (app) app.destroy();
    });
  </script>
</body>
</html>
