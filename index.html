<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mātauranga NOVA — Portal de Apoyo</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Mono&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    :root {
      --accent: #0ea5e9; /* Teal por defecto */
      --accent-rgb: 14, 165, 233;
      --bg: #080e18;
      --panel: rgba(13, 21, 37, 0.7);
      --text: #e8eef6;
      --red: #ef4444;
      --gold: #f59e0b;
      --transition-speed: 1.5s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sora', sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }

    /* Fondo de Red Neuronal */
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    
    /* Contenedor Principal con Glass Liquid Effect */
    #app {
      position: relative; z-index: 10; width: 95%; max-width: 900px; height: 85vh;
      background: var(--panel);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(var(--accent-rgb), 0.2);
      border-radius: 24px;
      display: flex; flex-direction: column;
      box-shadow: 0 40px 100px rgba(0,0,0,0.8);
      transition: border-color var(--transition-speed);
    }

    /* Header */
    header { padding: 20px 30px; border-bottom: 1px solid rgba(var(--accent-rgb), 0.1); display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 700; font-size: 20px; color: var(--accent); letter-spacing: 1px; transition: color var(--transition-speed); }
    .exit-btn { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px 20px; border-radius: 12px; font-weight: 600; font-size: 13px; cursor: pointer; }

    /* Chat Area */
    #chat { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
    .msg { max-width: 80%; line-height: 1.7; font-size: 15px; animation: fadeInUp 0.4s ease; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .msg.bot { align-self: flex-start; background: rgba(255,255,255,0.05); padding: 15px 20px; border-radius: 4px 18px 18px 18px; border: 1px solid rgba(var(--accent-rgb), 0.1); }
    .msg.user { align-self: flex-end; background: var(--accent); color: #fff; padding: 15px 20px; border-radius: 18px 4px 18px 18px; transition: background var(--transition-speed); }

    /* Input */
    footer { padding: 25px 30px; background: rgba(0,0,0,0.2); }
    .input-wrap { display: flex; gap: 15px; align-items: flex-end; }
    textarea { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(var(--accent-rgb), 0.3); border-radius: 15px; padding: 15px; color: var(--text); resize: none; outline: none; height: 55px; font-size: 15px; transition: border-color 0.3s; }
    textarea:focus { border-color: var(--accent); }
    #send { background: var(--accent); border: none; width: 55px; height: 55px; border-radius: 15px; cursor: pointer; font-size: 24px; transition: background var(--transition-speed); }

    /* Consent Overlay */
    #shield { position: absolute; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
    .shield-box { max-width: 500px; }
    .btn-start { background: var(--accent); color: #fff; border: none; padding: 18px 40px; border-radius: 12px; font-weight: 700; margin-top: 30px; cursor: pointer; width: 100%; transition: background var(--transition-speed); }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div id="app">
    <div id="shield">
      <div class="shield-box">
        <h1 style="color: var(--accent); margin-bottom: 20px;">Privacidad Absoluta</h1>
        <p style="color: #6b7c9a; line-height: 1.8;">Este chat es <strong>privado por diseño</strong>. Nada se guarda en nuestros servidores a largo plazo. Al cerrar esta ventana, tu conversación desaparece para siempre.</p>
        <button class="btn-start" onclick="startApp()">Entiendo — Empezar Sesión</button>
      </div>
    </div>

    <header>
      <div class="logo">MĀTAURANGA NOVA</div>
      <button class="exit-btn" onclick="quickExit()">✕ Salida Rápida</button>
    </header>

    <div id="chat"></div>

    <footer>
      <div class="input-wrap">
        <textarea id="msgInp" placeholder="Escribe aquí de forma segura..." rows="1"></textarea>
        <button id="send" onclick="sendMsg()">↗</button>
      </div>
    </footer>
  </div>

  <script>
    // --- LÓGICA DE LA RED NEURONAL VIVA ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let nodes = [];
    let currentColor = { r: 14, g: 165, b: 233 }; // Teal
    let targetColor = { r: 14, g: 165, b: 233 };
    let flowSpeed = 1;

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    class Node {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
      }
      update() {
        this.x += this.vx * flowSpeed;
        this.y += this.vy * flowSpeed;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
    }

    for (let i = 0; i < 100; i++) nodes.push(new Node());

    function animate() {
      // Interpolar colores suavemente
      currentColor.r += (targetColor.r - currentColor.r) * 0.02;
      currentColor.g += (targetColor.g - currentColor.g) * 0.02;
      currentColor.b += (targetColor.b - currentColor.b) * 0.02;
      const col = `rgb(${currentColor.r},${currentColor.g},${currentColor.b})`;
      
      // Actualizar CSS para sincronizar UI
      document.documentElement.style.setProperty('--accent', col);
      document.documentElement.style.setProperty('--accent-rgb', `${Math.round(currentColor.r)},${Math.round(currentColor.g)},${Math.round(currentColor.b)}`);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      nodes.forEach((n, i) => {
        n.update();
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(n.x, n.y, 2, 0, Math.PI*2); ctx.fill();
        
        for (let j = i + 1; j < nodes.length; j++) {
          const d = Math.hypot(n.x - nodes[j].x, n.y - nodes[j].y);
          if (d < 150) {
            ctx.strokeStyle = col;
            ctx.globalAlpha = 1 - d/150;
            ctx.lineWidth = 0.5;
            ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(nodes[j].x, nodes[j].y); ctx.stroke();
            ctx.globalAlpha = 1;
          }
        }
      });
      requestAnimationFrame(animate);
    }
    animate();

    // --- INTERACCIÓN Y CONTEXTO ---
    function setSentiment(type) {
      if (type === 'warm') targetColor = { r: 16, g: 185, b: 129 }; // Verde/Esmeralda
      else if (type === 'alert') targetColor = { r: 239, g: 68, b: 68 }; // Rojo
      else targetColor = { r: 14, g: 165, b: 233 }; // Teal
      flowSpeed = 3; setTimeout(() => flowSpeed = 1, 2000); // Pulso de velocidad
    }

    // --- CHAT LOGIC (SSE) ---
    async function sendMsg() {
      const inp = document.getElementById('msgInp');
      const text = inp.value.trim();
      if (!text) return;
      
      appendMsg('user', text);
      inp.value = '';
      flowSpeed = 5; // Reacción al tipeo

      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let botMsg = appendMsg('bot', '');

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const lines = decoder.decode(value).split('\n');
        lines.forEach(line => {
          if (!line.startsWith('data: ')) return;
          const data = JSON.parse(line.slice(6));
          if (data.type === 'metadata') setSentiment(data.sentiment);
          if (data.type === 'delta') {
            botMsg.innerHTML = marked.parse(data.text);
            document.getElementById('chat').scrollTop = 99999;
          }
        });
      }
    }

    function appendMsg(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = marked.parse(text);
      document.getElementById('chat').appendChild(div);
      return div;
    }

    function startApp() { document.getElementById('shield').style.display = 'none'; }
    function quickExit() { window.location.href = 'https://google.com'; }
  </script>
</body>
</html>
