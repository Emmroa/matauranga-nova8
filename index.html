<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mātauranga NOVA</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Mono&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    :root {
      --bg: #080e18;
      --text: #ffffff;
      --text-dim: #94a3b8;
      /* Glassmorphism Variables */
      --glass-bg: rgba(13, 21, 37, 0.65);
      --glass-border: rgba(255, 255, 255, 0.1);
      /* Semantic Colors */
      --teal-hex: #0ea5e9;
      --red-hex: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sora', sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }

    /* HTML5 Dynamic Canvas */
    #bgCanvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }

    /* Main Application Window (Glass Liquid) */
    #appWindow {
      position: relative; z-index: 10; width: 92%; max-width: 850px; height: 88vh;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* Header */
    header { padding: 18px 24px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); }
    .brand-title { font-weight: 700; font-size: 18px; letter-spacing: 1.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .brand-subtitle { font-size: 10px; color: var(--text-dim); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 2px; }
    .btn-exit { background: rgba(239, 68, 68, 0.2); color: var(--red-hex); border: 1px solid rgba(239, 68, 68, 0.4); padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 11px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; }
    .btn-exit:hover { background: var(--red-hex); color: #fff; }

    /* Chat Log */
    #chatLog { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
    #chatLog::-webkit-scrollbar { width: 6px; }
    #chatLog::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 6px; }

    .msg { max-width: 85%; animation: slideUp 0.3s ease forwards; opacity: 0; line-height: 1.6; font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; }
    
    .bubble { padding: 16px 20px; border-radius: 14px; }
    .msg.bot .bubble { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-top-left-radius: 4px; }
    .msg.user .bubble { background: rgba(14, 165, 233, 0.4); border: 1px solid rgba(14, 165, 233, 0.6); border-top-right-radius: 4px; }
    .msg.crisis .bubble { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); border-left: 4px solid var(--red-hex); }

    .bubble p { margin-bottom: 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong { color: #fff; font-weight: 700; }

    /* Input Area */
    #inputArea { padding: 20px 24px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--glass-border); display: flex; gap: 12px; }
    #chatInput { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 14px 16px; color: #fff; font-size: 14px; outline: none; resize: none; height: 50px; transition: border-color 0.2s; }
    #chatInput:focus { border-color: var(--teal-hex); background: rgba(255,255,255,0.1); }
    #btnSend { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 50px; height: 50px; border-radius: 12px; font-size: 18px; cursor: pointer; transition: background 0.2s; }
    #btnSend:hover { background: var(--teal-hex); border-color: var(--teal-hex); }

    /* Consent Shield */
    #shield { position: absolute; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; }
    .btn-start { background: var(--teal-hex); color: #fff; border: none; padding: 16px 32px; border-radius: 12px; font-weight: 700; font-size: 14px; margin-top: 30px; cursor: pointer; transition: transform 0.2s; }
    .btn-start:hover { transform: scale(1.05); }

  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div id="appWindow">
    
    <div id="shield">
      <div style="font-size: 48px; margin-bottom: 20px;">🔒</div>
      <h1 style="color: var(--teal-hex); margin-bottom: 16px;">Private by Design</h1>
      <p style="color: var(--text-dim); max-width: 450px; line-height: 1.8;">Everything is deleted when you close this window. Protected under the NZ Privacy Act 2020.</p>
      <button class="btn-start" onclick="initSession()">I understand — Start</button>
    </div>

    <header>
      <div>
        <div class="brand-title" id="brandText">MĀTAURANGA NOVA</div>
        <div class="brand-subtitle">● Secured Session</div>
      </div>
      <button class="btn-exit" onclick="destroySession()">✕ Quick Exit</button>
    </header>

    <div id="chatLog"></div>

    <div id="inputArea">
      <textarea id="chatInput" placeholder="Type here privately..." rows="1"></textarea>
      <button id="btnSend" onclick="handleSend()">↗</button>
    </div>

  </div>

  <script>
    // ==========================================
    // 1. NEURAL NETWORK CONTEXTUAL CANVAS
    // ==========================================
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    let mouse = { x: -1000, y: -1000 };
    
    // Color Interpolation State
    const COLORS = {
      neutral: { r: 14, g: 165, b: 233 },   // Teal
      warm: { r: 16, g: 185, b: 129 },      // Emerald Green
      alert: { r: 239, g: 68, b: 68 }       // Red
    };
    
    let currentColor = { ...COLORS.neutral };
    let targetColor = { ...COLORS.neutral };
    let activityPulse = 1; // Speed multiplier

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = (Math.random() - 0.5) * 0.6;
      }
      update() {
        this.x += this.vx * activityPulse;
        this.y += this.vy * activityPulse;
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;

        // Mouse Repulsion
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        if (Math.hypot(dx, dy) < 150) {
          this.x -= dx * 0.02;
          this.y -= dy * 0.02;
        }
      }
    }

    for (let i = 0; i < 90; i++) particles.push(new Particle());

    function drawNetwork() {
      // Smooth color transition logic
      currentColor.r += (targetColor.r - currentColor.r) * 0.03;
      currentColor.g += (targetColor.g - currentColor.g) * 0.03;
      currentColor.b += (targetColor.b - currentColor.b) * 0.03;
      
      const rgbString = `${Math.round(currentColor.r)}, ${Math.round(currentColor.g)}, ${Math.round(currentColor.b)}`;
      document.getElementById('brandText').style.color = `rgb(${rgbString})`;

      ctx.clearRect(0, 0, width, height);

      particles.forEach((p, i) => {
        p.update();
        ctx.fillStyle = `rgb(${rgbString})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const d = Math.hypot(p.x - particles[j].x, p.y - particles[j].y);
          if (d < 130) {
            ctx.strokeStyle = `rgba(${rgbString}, ${1 - d/130})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      });

      if (activityPulse > 1) activityPulse -= 0.02;
      requestAnimationFrame(drawNetwork);
    }
    drawNetwork();

    document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    document.getElementById('chatInput').addEventListener('input', () => { activityPulse = 2.5; }); // Spike on typing

    // ==========================================
    // 2. CHAT & SENTIMENT STREAMING LOGIC
    // ==========================================
    let sessionId = null;
    const chatLog = document.getElementById('chatLog');
    const input = document.getElementById('chatInput');

    async function initSession() {
      document.getElementById('shield').style.display = 'none';
      try {
        const res = await fetch('/session-start', { method: 'POST' });
        const data = await res.json();
        sessionId = data.sessionId;
      } catch (e) { console.error('API Error'); }
    }

    input.addEventListener('keypress', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });

    async function handleSend() {
      const text = input.value.trim();
      if (!text) return;
      
      input.value = '';
      appendBubble('user', text);
      activityPulse = 4; // Network reacts to sent message
      
      const botBubble = appendBubble('bot', '...');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, sessionId })
        });

        // Non-streaming JSON (Crisis intercept)
        if (res.headers.get('content-type')?.includes('application/json')) {
          const d = await res.json();
          botBubble.innerHTML = marked.parse(d.reply);
          if (d.sentiment) targetColor = COLORS[d.sentiment] || COLORS.neutral;
          if (d.crisis) botBubble.parentElement.classList.add('crisis');
          return;
        }

        // Server-Sent Events Parsing
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let streamedData = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const chunks = decoder.decode(value).split('\n');
          for (const chunk of chunks) {
            if (!chunk.startsWith('data: ')) continue;
            const raw = chunk.slice(6).trim();
            if (raw === '[DONE]') continue;
            try {
              const parsed = JSON.parse(raw);
              // Listen to the backend's sentiment tag and change Canvas color
              if (parsed.type === 'metadata' && parsed.sentiment) {
                targetColor = COLORS[parsed.sentiment] || COLORS.neutral;
                activityPulse = 3;
              }
              if (parsed.type === 'delta') {
                streamedData += parsed.text;
                botBubble.innerHTML = marked.parse(streamedData);
                chatLog.scrollTop = chatLog.scrollHeight;
              }
            } catch (e) {}
          }
        }
      } catch (err) {
        botBubble.innerHTML = '<em>Connection error.</em>';
      }
    }

    function appendBubble(role, text) {
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = text ? marked.parse(text) : '';
      wrap.appendChild(bubble);
      chatLog.appendChild(wrap);
      chatLog.scrollTop = chatLog.scrollHeight;
      return bubble;
    }

    function destroySession() {
      if(sessionId) fetch('/session-end', { method: 'POST', body: JSON.stringify({sessionId}), headers: {'Content-Type': 'application/json'} });
      window.location.href = 'https://burnettfoundation.org.nz'; // Hard exit
    }
  </script>
</body>
</html>
