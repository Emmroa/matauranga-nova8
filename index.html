<script>
  const API_URL = "https://matauranga-nova8.onrender.com/chat";
  const chatBox = document.getElementById('chat-box');
  const userInput = document.getElementById('userInput');
  const typing = document.getElementById('typing');
  const sendBtn = document.getElementById('sendBtn');
  const welcome = document.getElementById('welcome');

  let sessionId = "session-" + Date.now();

  function appendMsg(text, sender) {
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.innerText = text;
    if (chatBox) chatBox.insertBefore(div, typing || null);
    if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
  }

  function setLoading(state) {
    if (typing) typing.style.display = state ? 'block' : 'none';
    if (sendBtn) sendBtn.disabled = state;
    if (userInput) userInput.disabled = state;
  }

  async function sendMessage() {
    const text = userInput ? userInput.value.trim() : '';
    if (!text) return;

    if (welcome) welcome.style.display = 'none';

    appendMsg(text, 'user');
    if (userInput) {
      userInput.value = '';
      userInput.style.height = 'auto';
    }

    setLoading(true);

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: text, sessionId: sessionId })
      });

      if (!response.ok) {
        throw new Error(`Error del servidor: ${response.status}`);
      }

      const data = await response.json();
      const cleanText = (data.reply || "Sin respuesta").replace(/\[TAG:.*?\]/g, '').trim();
      appendMsg(cleanText || "Nova no pudo responder en este momento.", 'nova');

    } catch (err) {
      console.error(err);
      appendMsg("❌ Error: " + err.message + "\n\nEl servidor está activo pero hubo un problema al conectar.", 'nova');
    } finally {
      setLoading(false);
      if (userInput) userInput.focus();
    }
  }

  function checkEnter(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function quickMsg(text) {
    if (userInput) {
      userInput.value = text;
      sendMessage();
    }
  }

  function autoHeight(el) {
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  // Inicialización segura
  window.onload = function() {
    try {
      // Mensaje inicial de Nova
      appendMsg("Kia ora — soy NOVA. Vivo con VIH desde 2011 y estoy acá para acompañarte. Esta charla es privada. ¿Qué te anda pasando hoy?", 'nova');

      if (userInput) userInput.focus();

      // Health check visible
      fetch(API_URL.replace('/chat', '/health'))
        .then(r => r.json())
        .then(data => {
          console.log("✅ Backend OK", data);
        })
        .catch(() => {
          appendMsg("⚠️ No se pudo conectar al servidor. Verificá tu internet o redeploya en Render.", 'nova');
        });
    } catch (e) {
      const errorDiv = document.createElement('div');
      errorDiv.style.color = '#ff4444';
      errorDiv.style.padding = '20px';
      errorDiv.style.background = 'rgba(0,0,0,0.5)';
      errorDiv.innerHTML = `<strong>❌ Error al cargar NOVA:</strong><br>${e.message}<br><br>Probá recargar la página o avisale a Emanuel con una captura.`;
      document.body.appendChild(errorDiv);
    }
    <!-- DEBUG VISUAL PARA CELULAR -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
  </script>
</body>
</html>
