<script>
    const API_URL = "https://matauranga-nova8.onrender.com/chat";
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('userInput');
    const typing = document.getElementById('typing');
    const sendBtn = document.getElementById('sendBtn');
    const welcome = document.getElementById('welcome');

    // Session ID único por usuario
    let sessionId = "session-" + Date.now();

    function autoHeight(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function checkEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function quickMsg(text) {
      userInput.value = text;
      sendMessage();
    }

    function appendMsg(text, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerText = text;
      chatBox.insertBefore(div, typing);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setLoading(state) {
      typing.style.display = state ? 'block' : 'none';
      sendBtn.disabled = state;
      userInput.disabled = state;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      // Ocultar welcome y agregar mensaje del usuario
      if (welcome) welcome.style.display = 'none';
      
      appendMsg(text, 'user');
      userInput.value = '';
      userInput.style.height = 'auto';

      setLoading(true);

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            prompt: text,
            sessionId: sessionId 
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();

        if (data.reply) {
          // Limpiar posibles tags del system prompt
          const cleanText = data.reply
            .replace(/\[TAG:.*?\]/g, '')
            .replace(/\[CRISIS:.*?\]/g, '')
            .trim();
          
          appendMsg(cleanText, 'nova');
        } 
        else if (data.error) {
          appendMsg("Nova: " + data.error, 'nova');
        }
        else {
          appendMsg("Lo siento, no recibí una respuesta clara.", 'nova');
        }

      } catch (err) {
        console.error("Fetch error:", err);
        appendMsg("Error de conexión. Verifica que el servidor esté activo.", 'nova');
      } finally {
        setLoading(false);
        userInput.focus();
      }
    }

    // Mostrar mensaje inicial de NOVA al cargar
    function showWelcomeMessage() {
      const initialMsg = "Kia ora — soy NOVA. Vivo con VIH desde 2011 y estoy acá para acompañarte. Esta charla es privada. ¿Qué te anda pasando hoy?";
      appendMsg(initialMsg, 'nova');
    }

    // Inicialización
    window.onload = () => {
      // Mostrar mensaje de bienvenida de Nova
      showWelcomeMessage();
      
      // Auto-focus en el input
      userInput.focus();

      // Health check opcional (para debug)
      fetch(API_URL.replace('/chat', '/health'))
        .then(res => res.json())
        .then(data => {
          console.log("✅ Backend OK:", data);
        })
        .catch(() => {
          console.warn("⚠️ No se pudo conectar al health check");
        });
    };
</script>
