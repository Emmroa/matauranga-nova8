<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mātauranga Nova — Tutor IA</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ─── VARIABLES SOLARPUNK ─────────────────────────── */
    :root {
      --bg:        #0e1a12;
      --surface:   #132019;
      --surface2:  #1a2b20;
      --border:    rgba(134, 196, 112, 0.18);
      --green:     #86c470;
      --green-dim: #5a9e44;
      --gold:      #d4a83c;
      --text:      #e8f0e4;
      --muted:     rgba(232, 240, 228, 0.52);
      --radius:    18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh; /* Altura dinámica para evitar fallos con teclado en móvil */
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ─── FONDO ANIMADO (PC & MÓVIL) ───────────────────── */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.15; }
    .orb-1 { width: 400px; height: 400px; top: -100px; left: -100px; background: var(--green-dim); animation: drift 15s infinite; }
    .orb-2 { width: 300px; height: 300px; bottom: -50px; right: -50px; background: var(--gold); animation: drift 20s infinite reverse; }
    @keyframes drift {
      0%, 100% { transform: translate(0,0); }
      50% { transform: translate(30px, 50px); }
    }

    /* ─── CONTENEDOR PRINCIPAL (ADAPTATIVO) ─────────────── */
    .widget {
      position: relative;
      z-index: 10;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%; /* Por defecto en móvil: pantalla completa */
      transition: all 0.3s ease;
    }

    /* Ajuste para PC / Tablets */
    @media (min-width: 600px) {
      .widget {
        max-width: 450px;
        height: 85dvh;
        max-height: 750px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      }
    }

    /* ─── HEADER ───────────────────────────────────────── */
    .header {
      padding: 16px 20px;
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--green-dim); display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 15px var(--green-dim); }
    .header-info h2 { font-family: 'Syne', sans-serif; font-size: 16px; color: var(--green); }
    .header-status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 6px; height: 6px; background: #4caf50; border-radius: 50%; }

    /* ─── MENSAJES ─────────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      scrollbar-width: thin;
    }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14.5px; line-height: 1.5; position: relative; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    
    .msg.user { align-self: flex-end; background: #264a2e; color: white; border-bottom-right-radius: 4px; }
    .msg.nova { align-self: flex-start; background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

    /* ─── INPUT AREA ───────────────────────────────────── */
    .input-area {
      padding: 15px;
      background: rgba(0,0,0,0.2);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .input-wrapper { flex: 1; position: relative; }
    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      color: white;
      resize: none;
      max-height: 100px;
      font-size: 14px;
      outline: none;
    }
    button {
      width: 45px;
      height: 45px;
      background: var(--green-dim);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    button:hover { background: var(--green); transform: scale(1.05); }
    button:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ─── SUGERENCIAS (CHIPS) ───────────────────────────── */
    .welcome { text-align: center; margin-top: 20px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 15px; }
    .chip { padding: 6px 14px; background: rgba(134, 196, 112, 0.1); border: 1px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--green); cursor: pointer; transition: 0.2s; }
    .chip:hover { background: rgba(134, 196, 112, 0.2); }

    /* Indicador de escritura */
    .typing { display: none; align-self: flex-start; font-size: 12px; color: var(--muted); font-style: italic; }
  </style>
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="widget">
    <div class="header">
      <div class="avatar">🌿</div>
      <div class="header-info">
        <h2>Mātauranga Nova</h2>
        <div class="header-status"><span class="status-dot"></span> Activa ahora</div>
      </div>
    </div>

    <div class="messages" id="chat-box">
      <div class="welcome" id="welcome">
        <div style="font-size: 30px; margin-bottom: 10px;">✨</div>
        <p style="font-weight: 600;">Kia ora, soy Nova</p>
        <p style="font-size: 13px; color: var(--muted);">¿En qué puedo ayudarte hoy?</p>
        <div class="chips">
          <div class="chip" onclick="quickMsg('¿Qué es PrEP?')">🛡️ ¿Qué es PrEP?</div>
          <div class="chip" onclick="quickMsg('Háblame de U=U')">💊 U=U</div>
          <div class="chip" onclick="quickMsg('Necesito apoyo emocional')">💭 Apoyo</div>
        </div>
      </div>
      <div class="typing" id="typing">Nova está escribiendo...</div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="userInput" rows="1" placeholder="Escribe un mensaje..." oninput="autoHeight(this)" onkeydown="checkEnter(event)"></textarea>
      </div>
      <button id="sendBtn" onclick="sendMessage()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    const API_URL = "https://matauranga-nova8.onrender.com/chat";
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('userInput');
    const typing = document.getElementById('typing');
    const sendBtn = document.getElementById('sendBtn');
    const welcome = document.getElementById('welcome');

    function autoHeight(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    function checkEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function quickMsg(text) {
      userInput.value = text;
      sendMessage();
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      // Limpiar y preparar
      if (welcome) welcome.style.display = 'none';
      userInput.value = '';
      userInput.style.height = 'auto';
      appendMsg(text, 'user');
      
      // Bloquear UI
      setLoading(true);

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        const data = await response.json();
        
        if (data.reply) {
          // Limpiar tags invisibles const cleanText = data.reply.replace(//g, "").trim();
          appendMsg(cleanText, 'nova');
        } else {
          appendMsg("Lo siento, hubo un error en la respuesta.", 'nova');
        }
      } catch (err) {
        appendMsg("Error de conexión. Verifica que el servidor esté activo.", 'nova');
      } finally {
        setLoading(false);
      }
    }

    function appendMsg(text, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerText = text;
      // Insertar antes del indicador de escritura
      chatBox.insertBefore(div, typing);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setLoading(state) {
      typing.style.display = state ? 'block' : 'none';
      sendBtn.disabled = state;
      userInput.disabled = state;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
